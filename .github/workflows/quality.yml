name: PUI89 AI Robot Car Quality and Shared Core Contract Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  basic-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out AI Robot Car
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check required project documents
        run: |
          test -s README.md
          test -s SECURITY.md
          test -s docs/PROJECT_PLAN.md
          test -s docs/SAFETY_CASE.md
          test -s docs/UNIVERSAL_SHIELD.md
          test -s docs/AI_ARCHITECTURE.md
          test -s docs/AGENTIC_AI_SYSTEM.md
          test -s docs/AUTONOMOUS_SIMULATION.md
          test -s docs/PREDICTIVE_MAINTENANCE.md
          test -s docs/THREAT_MODEL.md
          test -s docs/AI_BENCHMARKS.md
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run dependency-free unit tests
        env:
        run: python -m unittest discover -s tests -v
      - name: Compile Python source
        run: python -m compileall -q pui89_car tests
      - name: Check whitespace errors
        run: git diff --check
