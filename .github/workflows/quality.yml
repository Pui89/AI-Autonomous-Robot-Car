name: PUI89 Compact Smart EV Quality and Shared Core Contract Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  basic-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out Compact Smart EV
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check required project documents and contract fixtures
        run: |
          test -s README.md
          test -s SECURITY.md
          test -s docs/PROJECT_PLAN.md
          test -s docs/SAFETY_CASE.md
          test -s docs/UNIVERSAL_SHIELD.md
          test -s docs/AI_ARCHITECTURE.md
          test -s docs/AGENTIC_AI_SYSTEM.md
          test -s docs/AUTONOMOUS_SIMULATION.md
          test -s docs/PREDICTIVE_MAINTENANCE.md
          test -s docs/THREAT_MODEL.md
          test -s docs/AI_BENCHMARKS.md
          test -s docs/MASTER_ENGINEERING_SPEC_V2.md
          test -s docs/AI_CAR_MODULE_CATALOG.md
          test -s docs/GITHUB_IMPLEMENTATION_BACKLOG_V2.md
          test -s docs/SHARED_AI_CORE_INTEGRATION_V0.1.md
          test -s pui89_car/intelligence.py
          test -s pui89_car/shared_contract_adapter.py
          test -s pui89-adapter.json
          test -s tests/test_vehicle_intelligence.py
          test -s tests/test_shared_contract_adapter.py
          for contract in observation world-state action-proposal failure-report evidence-passport; do
            test -s "tests/contracts/${contract}.valid.json"
            test -s "tests/contracts/${contract}.invalid.json"
          done
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Run dependency-free unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python source
        run: python -m compileall -q pui89_car tests
      - name: Check whitespace errors
        run: git diff --check
